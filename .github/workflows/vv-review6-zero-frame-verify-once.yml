name: VV review.6 zero-frame fix verify (one-shot)
on:
  push:
    branches: ['prepare/v0.10.2-review.6']
    paths: ['.github/workflows/vv-review6-zero-frame-verify-once.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install media utilities
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
      - name: Restore historical regression reference
        run: git fetch --no-tags origin cde7de6d8a83695291b7c6492805fe04d442f5c0
      - name: Install dependencies and run full source regressions
        run: |
          set -euo pipefail
          mkdir -p out
          npm ci --ignore-scripts --no-audit --no-fund
          npm test | tee out/vv-source-tests.log
          echo passed > out/source-tests.status
          node --test test/host-contract-regression.mjs | tee out/vv-host-contract.log
          echo passed > out/host-contract.status
      - name: Pack and verify exact review.6 candidate
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json > out/pack.json
          filename="$(node -p 'JSON.parse(require("node:fs").readFileSync("out/pack.json","utf8"))[0].filename')"
          mkdir -p out/vv-unpacked
          tar -xzf "$filename" -C out/vv-unpacked
          ln -s "$GITHUB_WORKSPACE/node_modules" out/vv-unpacked/package/node_modules
          VV_TARGET_ROOT="$GITHUB_WORKSPACE/out/vv-unpacked/package" node --test test/host-contract-regression.mjs | tee out/vv-packed-contract.log
          echo passed > out/packed-contract.status
          python3 - <<'PY'
          import json,tarfile,hashlib,pathlib,subprocess
          root=pathlib.Path('.')
          obj=json.loads((root/'out/pack.json').read_text())[0]
          archive=root/obj['filename']
          with tarfile.open(archive) as t:
              files=[x for x in t if x.isfile()]
              assert len(files)==51, len(files)
              checks=[]
              for x in files:
                  rel=x.name.removeprefix('package/')
                  actual=t.extractfile(x).read()
                  src=(root/rel).read_bytes()
                  assert actual==src, rel
                  checks.append({'name':rel,'sha256':hashlib.sha256(actual).hexdigest()})
          manifest={'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':checks,'archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'archive_file':archive.name}
          (root/'out/pack-verification.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (root/'out/SHA256SUMS.txt').write_text(manifest['archive_sha256']+'  '+archive.name+'\n')
          print('PACKAGE_VERIFIED',archive.name,len(files),manifest['archive_sha256'])
          PY
      - name: Preserve exact candidate and verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vv-review6-zero-frame-verification
          path: |
            tests4gptplay-dsh-video-vision-0.10.2-review.6.tgz
            out/SHA256SUMS.txt
            out/pack.json
            out/pack-verification.json
            out/vv-source-tests.log
            out/vv-host-contract.log
            out/vv-packed-contract.log
          if-no-files-found: warn

      - name: Record real CI outcome and remove one-shot verification file
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, json
          root=Path('out')
          src=(root/'source-tests.status').exists()
          host=(root/'host-contract.status').exists()
          packed=(root/'packed-contract.status').exists()
          pkg=(root/'pack-verification.json')
          digest=(json.loads(pkg.read_text())['archive_sha256'] if pkg.exists() else None)
          run=os.environ['GITHUB_RUN_ID']
          report=Path('docs/acceptance/REVIEW-20261110-ZERO-FRAME.md')
          report.parent.mkdir(parents=True,exist_ok=True)
          report.write_text(
              '# Video Vision review.6：零帧视觉范围修复验收\n\n'
              '本次修复仅修改零帧结果的 sampled_range_seconds：无帧返回 null；'
              '有帧仍返回真实采样时间范围。音频 analyzed_range_seconds 由音频处理结果提供。\n\n'
              '回归测试覆盖音频-only watch(frames=0)、关闭音频的 open(frames=0)、'
              '普通两帧取样。\n\n'
              f'- CI Run：https://github.com/Tests4gptplay/dsh-video-vision/actions/runs/{run}\n'
              f'- 源码测试：{"通过" if src else "未完成通过"}\n'
              f'- 新增/既有 Host 契约测试：{"通过" if host else "未完成通过"}\n'
              f'- 已打包候选再次验证：{"通过" if packed and digest else "未完成通过"}\n'
              f'- 候选 TGZ SHA-256：{digest or "未生成"}\n'
              '- 该操作只在开发分支执行，未执行正式发布。\n',
              encoding='utf-8'
          )
          PY
          git rm -- .github/workflows/vv-review6-zero-frame-verify-once.yml
          git add docs/acceptance/REVIEW-20261110-ZERO-FRAME.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(vv): record zero-frame verification and remove temporary CI helper'
          git push origin HEAD:refs/heads/prepare/v0.10.2-review.6
