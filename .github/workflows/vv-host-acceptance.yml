name: VV packed host contract acceptance
on:
  push:
    branches: [test/host-contract-20261110]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
      - uses: actions/checkout@v4
        with:
          ref: 26f389fdb16cee610c3c7f4dc3707ee8d2fda8db
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 26f389fdb16cee610c3c7f4dc3707ee8d2fda8db
          path: baseline
      - uses: actions/checkout@v4
        with:
          repository: Tests4gptplay/deepseek-harness
          ref: 562d10a963a41f31a7793441ab0f20ef521dcc24
          path: dsh
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - name: Install media tooling
        run: sudo apt-get install -y -qq ffmpeg
      - name: Prepare candidate and required historical test source
        run: |
          python3 controller/.github/vv-host-acceptance/prepare.py
          python3 controller/.github/vv-host-acceptance/followup.py
          git -C candidate fetch --no-tags --depth=1 origin cde7de6d8a83695291b7c6492805fe04d442f5c0
      - name: Install actual VV dependencies
        working-directory: candidate
        run: npm ci --ignore-scripts
      - name: Reproduce failures on the public runtime
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$PWD/candidate/node_modules" baseline/node_modules
          cd candidate
          set +e
          VV_TARGET_ROOT="$GITHUB_WORKSPACE/baseline" VV_LEGACY_ROOT="$GITHUB_WORKSPACE/baseline" node --test test/host-contract-regression.mjs > ../out/before.log 2>&1
          status=$?
          set -e
          cat ../out/before.log
          test "$status" -ne 0
      - name: Run all candidate regression tests
        working-directory: candidate
        env:
          VV_LEGACY_ROOT: ${{ github.workspace }}/baseline
          VV_TEST_REPORT: ${{ github.workspace }}/out/source-tests.json
        run: set -o pipefail; npm test 2>&1 | tee ../out/source-tests.log
      - name: Pack and inspect exact VV install files
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          npm pack --ignore-scripts --pack-destination ../out --json > ../out/pack.json
          cd ..
          mkdir -p out/vv-unpacked
          tar xzf out/tests4gptplay-dsh-video-vision-0.10.2-review.6.tgz -C out/vv-unpacked
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('out/vv-unpacked/package'); src=Path('candidate'); rows=[]
          for f in sorted(p.rglob('*')):
           if not f.is_file():continue
           r=f.relative_to(p);assert 'test' not in r.parts and 'node_modules' not in r.parts and '.github' not in r.parts,r
           assert f.read_bytes()==(src/r).read_bytes(),r
           rows.append({'path':str(r),'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'bytes':f.stat().st_size})
          Path('out/vv-manifest.json').write_text(json.dumps(rows,indent=2)+'\n')
          assert json.loads((p/'package.json').read_text())['name']=='@tests4gptplay/dsh-video-vision'
          assert (p/'README.md').read_bytes()==Path('baseline/README.md').read_bytes()
          print('PACK_FILES_MATCH_SOURCE',len(rows))
          PY
          ln -s "$PWD/candidate/node_modules" out/vv-unpacked/package/node_modules
          cd candidate
          VV_TARGET_ROOT="$GITHUB_WORKSPACE/out/vv-unpacked/package" VV_LEGACY_ROOT="$GITHUB_WORKSPACE/baseline" node --test test/host-contract-regression.mjs 2>&1 | tee ../out/packed-tests.log
      - name: Install locked DSH source dependencies
        working-directory: dsh
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test actual DSH source services with packed VV
        shell: bash
        env:
          VV_TARGET_ROOT: ${{ github.workspace }}/out/vv-unpacked/package
        run: |
          set -euo pipefail
          cp controller/.github/vv-host-acceptance/vv-package-host.spec.ts dsh/packages/attachment/attachment-local/tests/vv-package-host.spec.ts
          cd dsh
          pnpm exec vitest run packages/attachment/attachment-local/tests --reporter=verbose 2>&1 | tee ../out/dsh-source-tests.log
          pnpm exec tsc -b packages/attachment/attachment-local/tsconfig.json 2>&1 | tee ../out/dsh-compile.log
      - name: Build companion and test both exact packages in a clean installation
        run: set -o pipefail; python3 controller/.github/vv-host-acceptance/build-companion.py 2>&1 | tee out/companion-build-smoke.log
      - name: Prepare tested source branch without publishing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate/test/integration candidate/docs/acceptance
          cp controller/.github/vv-host-acceptance/vv-package-host.spec.ts candidate/test/integration/dsh-host.spec.ts
          cp controller/.github/vv-host-acceptance/build-companion.py candidate/test/integration/build-companion.py
          cp controller/.github/vv-host-acceptance/companion-smoke.mjs candidate/test/integration/companion-smoke.mjs
          cp out/source-tests.json out/vv-manifest.json out/attachment-manifest.json candidate/docs/acceptance/
          cp out/dsh-android-attachment-source.patch candidate/docs/acceptance/
          (cd out && sha256sum *.tgz > SHA256SUMS.txt)
          cp out/SHA256SUMS.txt candidate/docs/acceptance/
          printf 'Acceptance run: https://github.com/Tests4gptplay/dsh-video-vision/actions/runs/%s\nDSH source: 562d10a963a41f31a7793441ab0f20ef521dcc24\nVV baseline: 26f389fdb16cee610c3c7f4dc3707ee8d2fda8db\n' "$GITHUB_RUN_ID" > candidate/docs/acceptance/SOURCES.txt
          git -C candidate diff --check
          git -C candidate checkout -b prepare/v0.10.2-review.6
          git -C candidate config user.name 'github-actions[bot]'
          git -C candidate config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C candidate add index.js client.js lib resources test docs package.json package-lock.json
          git -C candidate commit -m 'fix: adapt VV media delivery to actual DSH contracts and preserve requested ranges'
          git -C candidate push origin HEAD:refs/heads/prepare/v0.10.2-review.6
          git -C candidate rev-parse HEAD > out/PREPARED_COMMIT.txt
      - name: Preserve source and exact evidence
        if: always()
        run: |
          mkdir -p out
          git -C candidate diff --binary 26f389fdb16cee610c3c7f4dc3707ee8d2fda8db > out/candidate-tracked.patch
          tar --exclude=node_modules --exclude=.git --exclude=.cache-tests -czf out/vv-source-candidate.tar.gz -C candidate .
          rm -rf out/vv-unpacked out/attachment-base out/attachment-staged out/attachment-unpacked
          (cd out && sha256sum *.tgz *.tar.gz > SHA256SUMS.txt) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vv-host-acceptance-${{ github.run_id }}
          path: out/
          if-no-files-found: error
