name: Update published installation instructions
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/update-install-guide-release-notes.yml'
      - 'scripts/release-display-v0.10.1/NOTES.md'
permissions:
  contents: read
concurrency:
  group: dsh-video-vision-installation-notes-v0.10.1
  cancel-in-progress: false
jobs:
  update-notes:
    if: github.repository == 'Tests4gptplay/dsh-video-vision'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update only the existing release body
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Tests4gptplay/dsh-video-vision
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/v0.10.1" > "$RUNNER_TEMP/release-before.json"
          jq -e '.tag_name == "v0.10.1" and .draft == false and .prerelease == false' "$RUNNER_TEMP/release-before.json"
          jq -r .body "$RUNNER_TEMP/release-before.json" > "$RUNNER_TEMP/body-before.md"
          test "$(sha256sum "$RUNNER_TEMP/body-before.md" | cut -d' ' -f1)" = '06c4b9c83e3e740580f13bb982edd302b469e57dcf34c2beba1e46de9c8f3fe4'
          jq '[.assets[] | {id, name, size, digest}]' "$RUNNER_TEMP/release-before.json" > "$RUNNER_TEMP/assets-before.json"
          gh api "repos/$GH_REPO/git/ref/tags/v0.10.1" > "$RUNNER_TEMP/tag-before.json"
          test "$(jq -r .object.sha "$RUNNER_TEMP/tag-before.json")" = '3dd7834c4bd8cc559bfb4a5d78ca55ca66e23840'
          test "$(sha256sum scripts/release-display-v0.10.1/NOTES.md | cut -d' ' -f1)" = 'fe13d0a1fc839adb3474392a976769fb6f17ac47d400cc5c56fa2fc053d19627'
          gh release edit v0.10.1 --notes-file scripts/release-display-v0.10.1/NOTES.md
          gh api "repos/$GH_REPO/releases/tags/v0.10.1" > "$RUNNER_TEMP/release-after.json"
          jq '[.assets[] | {id, name, size, digest}]' "$RUNNER_TEMP/release-after.json" > "$RUNNER_TEMP/assets-after.json"
          cmp "$RUNNER_TEMP/assets-before.json" "$RUNNER_TEMP/assets-after.json"
          gh api "repos/$GH_REPO/git/ref/tags/v0.10.1" > "$RUNNER_TEMP/tag-after.json"
          cmp "$RUNNER_TEMP/tag-before.json" "$RUNNER_TEMP/tag-after.json"
          jq -r .body "$RUNNER_TEMP/release-after.json" > "$RUNNER_TEMP/body-after.md"
          diff -u <(sed -e '${/^$/d;}' scripts/release-display-v0.10.1/NOTES.md) <(sed -e '${/^$/d;}' "$RUNNER_TEMP/body-after.md")
